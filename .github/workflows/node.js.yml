name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [10.9.2]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      # Clear problematic dependencies before install
      - name: Clean node_modules and package-lock.json
        run: |
          rm -rf node_modules package-lock.json

      # Ensure clean, deterministic install
      - name: Install dependencies
        run: npm ci

      # Set NPM to ignore optional dependencies (fix for Rollup issue)
      - name: Ignore optional dependencies
        run: npm config set optional false

      # Build step
      - name: Build the project
        run: npm run build --if-present
